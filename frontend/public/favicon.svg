<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Canvas -->
    <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Sync Arc: Electric Cyan to Vibrant Blue -->
    <linearGradient id="sbTopGrad" x1="18" y1="15" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Bottom Sync Arc: Vivid Violet to Cobalt Cyan -->
    <linearGradient id="sbBottomGrad" x1="46" y1="49" x2="20" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Refined Border Stroke -->
    <linearGradient id="sbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Ambient Core Glow -->
    <radialGradient id="sbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Sleek Squircle Container -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#sbBg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#sbGlow)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" stroke="url(#sbBorder)" stroke-width="1.2" />

  <!-- 2. Upper Sync Loop (Letter S - Top) -->
  <path
    d="M 20 28 C 20 19.5 25.5 15 33 15 C 41 15 44.5 19.5 44.5 25.5 C 44.5 31.5 39.5 35 32 37.5"
    stroke="url(#sbTopGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Lower Sync Loop (Letter S - Bottom) -->
  <path
    d="M 44 36 C 44 44.5 38.5 49 31 49 C 23 49 19.5 44.5 19.5 38.5 C 19.5 32.5 24.5 29 32 26.5"
    stroke="url(#sbBottomGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 4. Central Kinetic Pulse Node (AI Sync Spark) -->
  <circle cx="32" cy="32" r="2.6" fill="#38BDF8" />
  <circle cx="32" cy="32" r="1.2" fill="#FFFFFF" />
</svg>